<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tukist — CLI</title>
<style>
:root{--bg:#0a0a0a;--fg:#33ff33;--fd:#1a7a1a;--fa:#00ff41;--ff:'Courier New','IBM Plex Mono','Consolas',monospace}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:var(--ff);font-size:14px;color:var(--fg);background:var(--bg);text-shadow:0 0 3px rgba(51,255,51,.3)}

.crt{position:fixed;inset:0;pointer-events:none;z-index:9999}
.crt::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px)}
.crt::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.5) 100%);animation:flicker .15s infinite alternate}
@keyframes flicker{0%{opacity:.97}100%{opacity:1}}

.noise{position:fixed;inset:0;pointer-events:none;z-index:9998;opacity:.025;mix-blend-mode:overlay}
.noise::after{content:'';position:absolute;inset:-50%;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:128px 128px;animation:noise .8s steps(4) infinite}
@keyframes noise{0%,100%{transform:translate(0,0)}25%{transform:translate(-10%,5%)}50%{transform:translate(5%,-10%)}75%{transform:translate(-5%,15%)}}

.term{height:100%;display:flex;flex-direction:column;position:relative;z-index:1}
#out{flex:1;overflow-y:auto;padding:.8rem 1rem;font-size:.75rem;line-height:1.35;white-space:pre-wrap;word-break:break-all}
#out::-webkit-scrollbar{width:6px}
#out::-webkit-scrollbar-track{background:var(--bg)}
#out::-webkit-scrollbar-thumb{background:var(--fd)}

.line{min-height:1.35em}
.prompt{color:var(--fa)}
.cursor{color:var(--fa);animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
#inline{outline:none;caret-color:transparent}

.c-err{color:#ff4444}.c-acc{color:var(--fa)}.c-dim{color:var(--fd)}.c-bold{font-weight:700}
.c-link{color:var(--fa);text-decoration:underline;cursor:pointer}
</style>
</head>
<body>

<div class="crt"></div>
<div class="noise"></div>

<div class="term">
  <div id="out"></div>
</div>

<script>
var out=document.getElementById('out'),inline,history=[],histIdx=-1,cwd='~',
    locked='';  // everything before current prompt, locked from editing

// ── Audio ──
var A={ctx:null,init(){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}},
  p(f,d,t){if(!this.ctx)this.init();if(!this.ctx)return;var o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=t||'square';o.frequency.value=f;g.gain.setValueAtTime(.03,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+d);o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+d)},
  tick(){this.p(800,.025)},enter(){this.p(500,.05)},err(){this.p(150,.2,'sawtooth')}
};
document.addEventListener('click',function(){A.init()},{once:true});

function el(t,c){var d=document.createElement(t);if(c)d.className=c;return d}

function appendLine(html){
  var d=el('div','line');d.innerHTML=html;out.appendChild(d);
}

function newPrompt(){
  var d=el('div','line');
  var s=el('span','prompt');s.textContent='tukist@cli:~$ ';
  var i=el('span');i.setAttribute('contenteditable','true');i.id='inline';
  var c=el('span','cursor');c.textContent='\u2588';
  d.appendChild(s);d.appendChild(i);d.appendChild(c);
  out.appendChild(d);
  inline=i;
  inline.focus();
  out.scrollTop=out.scrollHeight;
}

function startup(){
  out.innerHTML="";
  appendLine("╭──────────────────────────────────────────────────────────────────────────────────────────────────╮");
  appendLine("│ ⣇⣿⠘⣿⣿⣿⡿⡿⣟⣟⢟⢟⢝⠵⡝⣿⡿⢂⣼⣿⣷⣌⠩⡫⡻⣝⠹⢿⣿⣷        Welcome to Tukist CLI!                                     │");
  appendLine("│ ⡆⣿⣆⠱⣝⡵⣝⢅⠙⣿⢕⢕⢕⢕⢝⣥⢒⠅⣿⣿⣿⡿⣳⣌⠪⡪⣡⢑⢝⣇        Type help to begin.                                        │");
  appendLine("│ ⡆⣿⣿⣦⠹⣳⣳⣕⢅⠈⢗⢕⢕⢕⢕⢕⢈⢆⠟⠋⠉⠁⠉⠉⠁⠈⠼⢐⢕⢽                                                                   │");
  appendLine("│ ⡗⢰⣶⣶⣦⣝⢝⢕⢕⠅⡆⢕⢕⢕⢕⢕⣴⠏⣠⡶⠛⡉⡉⡛⢶⣦⡀⠐⣕⢕        Directory: ~/                                              │");
  appendLine("│ ⡝⡄⢻⢟⣿⣿⣷⣕⣕⣅⣿⣔⣕⣵⣵⣿⣿⢠⣿⢠⣮⡈⣌⠨⠅⠹⣷⡀⢱⢕        Session:   terminal_01                                     │");
  appendLine("│ ⡝⡵⠟⠈⢀⣀⣀⡀⠉⢿⣿⣿⣿⣿⣿⣿⣿⣼⣿⢈⡋⠴⢿⡟⣡⡇⣿⡇⡀⢕        Model:     Brain v1.0                                      │");
  appendLine("│ ⡝⠁⣠⣾⠟⡉⡉⡉⠻⣦⣻⣿⣿⣿⣿⣿⣿⣿⣿⣧⠸⣿⣦⣥⣿⡇⡿⣰⢗⢄        Version:   0.1.0                                           │");
  appendLine("│ ⠁⢰⣿⡏⣴⣌⠈⣌⠡⠈⢻⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣬⣉⣉⣁⣄⢖⢕⢕⢕        Machine:   DESKTOP-WEB                                     │");
  appendLine("│ ⡀⢻⣿⡇⢙⠁⠴⢿⡟⣡⡆⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣷⣵⣵⣿        CPU:       Browser JavaScript                              │");
  appendLine("│ ⡻⣄⣻⣿⣌⠘⢿⣷⣥⣿⠇⣿⣿⣿⣿⣿⣿⠛⠻⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿        Memory:    Unlimited                                       │");
  appendLine("│ ⣷⢄⠻⣿⣟⠿⠦⠍⠉⣡⣾⣿⣿⣿⣿⣿⣿⢸⣿⣦⠙⣿⣿⣿⣿⣿⣿⣿⣿⠟        Kernel:    WebKit/Blink                                    │");
  appendLine("│ ⡕⡑⣑⣈⣻⢗⢟⢞⢝⣻⣿⣿⣿⣿⣿⣿⣿⠸⣿⠿⠃⣿⣿⣿⣿⣿⣿⡿⠁⣠        Shell:     cli.html                                        │");
  appendLine("│ ⡝⡵⡈⢟⢕⢕⢕⢕⣵⣿⣿⣿⣿⣿⣿⣿⣿⣿⣶⣶⣿⣿⣿⣿⣿⠿⠋⣀⣈⠙        Node:      N/A (browser)                                   │");
  appendLine("│ ⡝⡵⡕⡀⠑⠳⠿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⠿⠛⢉⡠⡲⡫⡪⡪⡣        MCP:       local only                                      │");
  appendLine("╰──────────────────────────────────────────────────────────────────────────────────────────────────╯");
  appendLine("");
  appendLine("<span class=c-dim>type help to begin</span>");
  newPrompt();
}

function whoami(){cmds.whoami()}

function exec(input){
  var args=input.trim().split(/\s+/),c=(args[0]||'').toLowerCase();args.shift();
  A.enter();
  if(!c)return;
  if(cmds[c]){cmds[c](args)}
  else{appendLine('<span class="c-err">command not found: '+c+'</span>');A.err()}
}

// ── Input handling ──
out.addEventListener('keydown',function(e){
  if(!inline)return;
  if(e.key==='Enter'){
    e.preventDefault();
    var txt=inline.textContent.trim();
    // Freeze current line
    var curLine=inline.parentElement;
    curLine.removeChild(curLine.querySelector('.cursor'));
    inline.removeAttribute('contenteditable');
    inline.id='';
    curLine.innerHTML='<span class="prompt">tukist@cli:~$ </span>'+txt;
    history.push(txt);histIdx=history.length;
    if(txt)exec(txt);
    newPrompt();
  }else if(e.key==='ArrowUp'){
    e.preventDefault();
    if(histIdx>0){histIdx--;inline.textContent=history[histIdx]}
  }else if(e.key==='ArrowDown'){
    e.preventDefault();
    if(histIdx<history.length-1){histIdx++;inline.textContent=history[histIdx]}
    else{histIdx=history.length;inline.textContent=''}
  }else if(e.key==='Tab'){
    e.preventDefault();
    var v=inline.textContent.toLowerCase(),keys=Object.keys(cmds);
    for(var i=0;i<keys.length;i++){if(keys[i].startsWith(v)){inline.textContent=keys[i];break}}
  }else if(e.key.length===1||e.key==='Backspace'){
    // Allow normal typing
    A.tick();
  }
});

// Click to focus
out.addEventListener('click',function(){
  if(inline)inline.focus();
});

startup();
</script>
</body>
</html>
