<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tukist — CLI</title>
<style>
:root{--bg:#0a0a0a;--fg:#33ff33;--fd:#1a7a1a;--fa:#00ff41;--ff:'Courier New','IBM Plex Mono','Consolas',monospace}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:var(--ff);font-size:14px;color:var(--fg);background:var(--bg);text-shadow:0 0 3px rgba(51,255,51,.3)}

/* CRT overlay */
.crt{position:fixed;inset:0;pointer-events:none;z-index:9999}
.crt::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px)}
.crt::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.5) 100%);animation:flicker .15s infinite alternate}
@keyframes flicker{0%{opacity:.97}100%{opacity:1}}

.noise{position:fixed;inset:0;pointer-events:none;z-index:9998;opacity:.025;mix-blend-mode:overlay}
.noise::after{content:'';position:absolute;inset:-50%;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:128px 128px;animation:noise .8s steps(4) infinite}
@keyframes noise{0%,100%{transform:translate(0,0)}25%{transform:translate(-10%,5%)}50%{transform:translate(5%,-10%)}75%{transform:translate(-5%,15%)}}

/* Terminal */
.term{height:100%;display:flex;flex-direction:column;position:relative;z-index:1}
.output{flex:1;overflow-y:auto;padding:1rem 1.2rem;white-space:pre-wrap;word-break:break-all;font-size:.82rem;line-height:1.5;scroll-behavior:smooth}
.output::-webkit-scrollbar{width:6px}
.output::-webkit-scrollbar-track{background:var(--bg)}
.output::-webkit-scrollbar-thumb{background:var(--fd)}
.input-line{display:flex;align-items:center;padding:.5rem 1.2rem;border-top:1px solid var(--fd);background:rgba(10,10,10,.95);flex-shrink:0}
.prompt{color:var(--fa);white-space:nowrap;font-size:.82rem}
#cmd{flex:1;background:none;border:none;color:var(--fg);font-family:var(--ff);font-size:.82rem;outline:none;caret-color:var(--fa);text-shadow:0 0 3px rgba(51,255,51,.3)}
#cmd::placeholder{color:var(--fd)}

.c-err{color:#ff4444}.c-accent{color:var(--fa)}.c-dim{color:var(--fd)}.c-bold{font-weight:700}
.c-link{color:var(--fa);text-decoration:underline;cursor:pointer}
.br-art{font-family:var(--ff);font-size:.62rem;line-height:1.44;letter-spacing:0;white-space:pre;color:var(--fd)}

/* Help table */
.help-table{display:grid;grid-template-columns:auto 1fr;gap:.3rem 1.5rem;margin:.5rem 0}
.help-table span:nth-child(odd){color:var(--fa)}
</style>
</head>
<body>

<div class="crt"></div>
<div class="noise"></div>

<div class="term" id="term">
  <div class="output" id="out"></div>
  <div class="input-line">
    <span class="prompt" id="prompt">tukist@cli:~$&nbsp;</span>
    <input type="text" id="cmd" placeholder="type help to begin..." autofocus autocomplete="off" spellcheck="false">
  </div>
</div>

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function whoami(){cmds.whoami()}

function exec(input){
  var args=input.trim().split(/\s+/),c=args[0].toLowerCase();args.shift();
  A.enter();
  if(!c)return;
  if(c==='exit'||c==='quit'){writeln('<span class="c-dim">$ type 'exit' to disconnect</span>');return}
  if(cmds[c]){cmds[c](args)}
  else{writeln('<span class="c-err">command not found: '+esc(c)+'</span>  <span class="c-dim">type help for available commands</span>');A.err()}
}

cmd.addEventListener('keydown',function(e){
  if(e.key==='Enter'){
    var v=cmd.value.trim();
    writeln('<span class="c-dim">'+esc(prompt.textContent)+'</span>'+esc(v));
    history.push(v);histIdx=history.length;exec(v);cmd.value='';
    e.preventDefault();
  }else if(e.key==='ArrowUp'){
    e.preventDefault();
    if(histIdx>0){histIdx--;cmd.value=history[histIdx]}
  }else if(e.key==='ArrowDown'){
    e.preventDefault();
    if(histIdx<history.length-1){histIdx++;cmd.value=history[histIdx]}
    else{histIdx=history.length;cmd.value=''}
  }else if(e.key==='Tab'){
    e.preventDefault();
    var v=cmd.value.toLowerCase(),keys=Object.keys(cmds);
    for(var i=0;i<keys.length;i++){if(keys[i].startsWith(v)){cmd.value=keys[i];break}}
  }else{
    A.tick();
  }
});

// Click anywhere to focus
term.addEventListener('click',function(){cmd.focus()});

// Startup
banner();
