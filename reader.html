<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线读书 — Tukist</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root{--bg:#f4efe6;--fg:#2a2520;--fd:#8a7a65;--fa:#E67E00;--fe:#D32F2F;--fc:#388E3C;--ff:'Cascadia Code','Courier New',monospace}
[data-theme="dark"]{--bg:#0d0d0d;--fg:#e8dcc8;--fd:#6b6050;--fa:#FFA726;--fe:#EF5350;--fc:#81C784}
*{margin:0;padding:0;box-sizing:border-box;transition:background .35s ease,color .3s ease,border-color .35s ease,box-shadow .35s ease,opacity .3s ease}
body{font-family:var(--ff);background:var(--bg);color:var(--fg);line-height:1.8;transition:background .4s,color .4s}
a{color:var(--fa);text-decoration:none}
a:hover{text-decoration:underline}

/* ── 优雅滚动条（滚动时显示、停止后淡出） ── */
.sidebar::-webkit-scrollbar{width:5px}
.sidebar::-webkit-scrollbar-track{background:transparent}
.sidebar::-webkit-scrollbar-thumb{background:transparent;transition:background .4s ease}
.sidebar.scrolling::-webkit-scrollbar-thumb{background:var(--fd)}
.sidebar.scrolling::-webkit-scrollbar-thumb:hover{background:var(--fa)}
/* Firefox */
.sidebar{scrollbar-width:thin;scrollbar-color:transparent transparent}
.sidebar.scrolling{scrollbar-color:var(--fd) transparent}

/* ── 顶栏 ── */
.topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem 1.2rem;border-bottom:1px solid var(--fd);background:var(--bg);backdrop-filter:blur(2px)}
.topbar .left{display:flex;align-items:center;gap:1rem;min-width:0}
.topbar .back{font-size:.8rem;color:var(--fa);white-space:nowrap}
.topbar .book-title{font-size:.85rem;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .right{display:flex;align-items:center;gap:.6rem}
.toc-btn{background:none;border:1px solid var(--fd);color:var(--fg);padding:3px 10px;cursor:pointer;font-family:var(--ff);font-size:.72rem}
.toc-btn:hover{border-color:var(--fa);color:var(--fa)}
.theme-btn{background:none;border:none;color:var(--fd);cursor:pointer;font-family:var(--ff);font-size:.8rem;padding:2px 4px}
.theme-btn:hover{color:var(--fa)}

/* ── 布局 ── */
.layout{display:flex;align-items:flex-start;max-width:1060px;margin:0 auto;padding:1.5rem 1.2rem;gap:1.5rem}
.sidebar{width:280px;flex:0 0 280px;position:sticky;top:60px;max-height:calc(100vh - 90px);overflow-y:auto;overflow-x:hidden;border-right:1px solid var(--fd);padding-right:1rem;transition:width .3s ease,flex-basis .3s ease,opacity .25s ease,border-color .3s ease,padding-right .3s ease}
.layout.collapsed .sidebar{width:0;flex:0 0 0;opacity:0;border-right-color:transparent;padding-right:0;pointer-events:none}
.content{flex:1;min-width:0;max-width:760px;margin:0 auto}

/* ── 章节切换淡入淡出 ── */
.text-fade{opacity:0;transition:opacity .5s ease-in-out}
.text-fade.show{opacity:1}

/* ── 章节目录 ── */
.sidebar h2{font-size:.8rem;color:var(--fa);margin-bottom:.8rem;letter-spacing:.05em}
.ch-list{list-style:none}
.ch-list li{margin:0}
.ch-list a{display:block;font-size:.76rem;color:var(--fd);padding:3px 8px;border-left:2px solid transparent;transition:all .1s}
.ch-list a:hover{color:var(--fg);text-decoration:none}
.ch-list a.active{color:var(--fa);border-left-color:var(--fa);background:rgba(138,122,101,.08)}
.ch-list a .idx{color:var(--fd);opacity:.7;margin-right:.4rem;font-size:.66rem}

/* ── 正文（与 article.html 一致） ── */
.article-body{font-size:.95rem;line-height:1.9}
.article-body h1{font-size:1.6rem;line-height:1.3;margin-bottom:1.2rem;color:var(--fg)}
.article-body h2{font-size:1.2rem;margin:1.6rem 0 .7rem;color:var(--fa)}
.article-body h3{font-size:1.05rem;margin:1.4rem 0 .6rem}
.article-body p{margin:.85rem 0}
.article-body ul,.article-body ol{margin:.8rem 0 .8rem 1.5rem}
.article-body li{margin:.3rem 0}
.article-body code{font-family:var(--ff);background:rgba(138,122,101,.12);padding:1px 5px;font-size:.85em}
.article-body pre{background:rgba(138,122,101,.12);padding:1rem;overflow-x:auto;margin:1rem 0;font-size:.82rem;line-height:1.6}
.article-body pre code{background:none;padding:0}
.article-body blockquote{border-left:3px solid var(--fa);padding:.5rem 1rem;margin:1rem 0;color:var(--fd);background:rgba(138,122,101,.06)}
.article-body a{color:var(--fa)}
.article-body img{max-width:100%;height:auto}
.article-body table{border-collapse:collapse;width:100%;margin:1rem 0}
.article-body th,.article-body td{border:1px solid var(--fd);padding:.5rem .8rem;text-align:left}
.article-body th{background:rgba(138,122,101,.1)}
.article-body hr{border:none;border-top:1px solid var(--fd);margin:2rem 0;opacity:.4}

/* ── 上/下章导航 ── */
.pager{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-top:2.5rem;padding-top:1.2rem;border-top:1px solid var(--fd)}
.pager a{font-size:.8rem;color:var(--fa)}
.pager a.disabled{color:var(--fd);opacity:.5;pointer-events:none;text-decoration:none}
.pager .pos{font-size:.72rem;color:var(--fd)}

.loading,.error{color:var(--fd);padding:2rem 0}
.error{color:var(--fe)}

/* ── 响应式 ── */
@media (max-width:820px){
  .toc-btn{display:block}
  .layout{flex-direction:column;padding-top:.8rem}
  .sidebar{width:100%;flex:none;position:static;max-height:none;border-right:none;border-bottom:1px solid var(--fd);padding-right:0;padding-bottom:1rem;display:none}
  .sidebar.open{display:block}
  .content{max-width:100%}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="left">
    <a href="index.html" class="back">&larr; 返回</a>
    <span class="book-title">在线读书 · 肠子</span>
  </div>
  <div class="right">
    <button class="toc-btn" id="toc-btn" title="目录">目录</button>
    <button class="theme-btn" id="theme-btn" title="切换主题">&#x25CB;</button>
  </div>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <h2>章节目录</h2>
    <ul class="ch-list" id="ch-list"></ul>
  </aside>

  <main class="content">
    <div id="article" class="text-fade"><p class="loading">加载中...</p></div>
    <nav class="pager" id="pager">
      <a href="#" id="prev" class="disabled">&larr; 上一章</a>
      <span class="pos" id="pos"></span>
      <a href="#" id="next" class="disabled">下一章 &rarr;</a>
    </nav>
  </main>
</div>

<script>
(function(){
  var chapters = [];       // [{id,title}]
  var currentIndex = -1;

  var $article = document.getElementById('article');
  var $list = document.getElementById('ch-list');
  var $prev = document.getElementById('prev');
  var $next = document.getElementById('next');
  var $pos = document.getElementById('pos');

  // ── 主题 ──
  var themeBtn = document.getElementById('theme-btn');
  var theme = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', theme);
  themeBtn.textContent = theme === 'dark' ? '\u25D0' : '\u25CB';
  themeBtn.addEventListener('click', function(){
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    themeBtn.textContent = next === 'dark' ? '\u25D0' : '\u25CB';
  });

  // ── 目录开关（桌面折叠 / 移动端展开） ──
  var tocBtn = document.getElementById('toc-btn');
  var sidebar = document.getElementById('sidebar');
  var layout = document.querySelector('.layout');

  // ── 目录滚动条：滚动时显示，停止后淡出 ──
  var scrollTimer;
  sidebar.addEventListener('scroll', function(){
    sidebar.classList.add('scrolling');
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(function(){ sidebar.classList.remove('scrolling'); }, 1000);
  });
  tocBtn.addEventListener('click', function(){
    if (window.innerWidth > 820){
      layout.classList.toggle('collapsed');
    } else {
      sidebar.classList.toggle('open');
    }
  });

  // ── 工具 ──
  function renderMarkdown(md){
    return marked.parse ? marked.parse(md) : marked(md);
  }

  // ── 定位到某章 ──
  function locate(id){
    for (var i = 0; i < chapters.length; i++){
      if (chapters[i].id === id) return i;
    }
    return -1;
  }

  // ── 加载并渲染章节 ──
  function loadChapter(index){
    if (index < 0 || index >= chapters.length) return;
    currentIndex = index;
    var ch = chapters[index];

    // 高亮目录
    var links = $list.querySelectorAll('a');
    links.forEach(function(a, i){
      a.classList.toggle('active', i === index);
      if (i === index) a.scrollIntoView({block:'nearest'});
    });

    // 上/下章按钮状态
    $prev.classList.toggle('disabled', index === 0);
    $next.classList.toggle('disabled', index === chapters.length - 1);
    $pos.textContent = (index + 1) + ' / ' + chapters.length;

    // 同步 URL（不刷新）
    var url = new URL(location.href);
    url.searchParams.set('ch', ch.id);
    history.replaceState(null, '', url.toString());

    document.title = ch.title + ' — Tukist';

    // 重叠交叉淡化：淡出到一半就换内容开始淡入
    $article.classList.remove('show');
    setTimeout(function(){
      fetch('book/' + ch.id + '.md')
        .then(function(r){
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.text();
        })
        .then(function(md){
          $article.innerHTML = '<div class="article-body">' + renderMarkdown(md) + '</div>';
          window.scrollTo(0, 0);
          // 强制重排后立即加 show，让淡入与尚未结束的淡出重叠
          void $article.offsetWidth;
          $article.classList.add('show');
        })
        .catch(function(e){
          $article.innerHTML = '<p class="error">加载失败: ' + e.message + '</p>';
          $article.classList.add('show');
        });
    }, 300);
  }

  // ── 初始化 ──
  fetch('book/index.json')
    .then(function(r){ return r.json(); })
    .then(function(data){
      chapters = data;
      if (!chapters.length){ $article.innerHTML = '<p class="error">没有找到章节。</p>'; return; }

      // 生成目录
      $list.innerHTML = chapters.map(function(ch, i){
        return '<li><a href="?ch=' + ch.id + '" data-index="' + i + '">' +
               '<span class="idx">' + String(i + 1).padStart(2, '0') + '</span>' + ch.title + '</a></li>';
      }).join('');

      // 目录点击（阻止默认跳转，交给 loadChapter 处理）
      $list.addEventListener('click', function(e){
        var a = e.target.closest('a');
        if (!a) return;
        e.preventDefault();
        loadChapter(parseInt(a.getAttribute('data-index'), 10));
        sidebar.classList.remove('open');
      });

      // 上/下章
      $prev.addEventListener('click', function(e){
        e.preventDefault();
        if (currentIndex > 0) loadChapter(currentIndex - 1);
      });
      $next.addEventListener('click', function(e){
        e.preventDefault();
        if (currentIndex < chapters.length - 1) loadChapter(currentIndex + 1);
      });

      // 定位到 URL 指定的章节
      var params = new URLSearchParams(location.search);
      var idx = locate(params.get('ch'));
      if (idx === -1) idx = 0;
      loadChapter(idx);
    })
    .catch(function(e){
      $article.innerHTML = '<p class="error">目录加载失败: ' + e.message + '</p>';
    });
})();
</script>
</body>
</html>
